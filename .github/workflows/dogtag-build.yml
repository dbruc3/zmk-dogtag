name: DogTag firmware

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dogtag-build.yml
      - app/boards/shields/dogtag/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    strategy:
      fail-fast: false
      matrix:
        shield: [dogtag_left, dogtag_right]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize ZMK workspace
        run: |
          west init -l app
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Build ${{ matrix.shield }}
        run: west build -s app -p -b nice_nano/nrf52840/zmk -- -DSHIELD=${{ matrix.shield }}
      - name: Upload ${{ matrix.shield }} firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.shield }}-nice_nano
          path: build/zephyr/zmk.uf2
          if-no-files-found: error
